name: Build CivicPulse Admin (Windows .exe)

on:
  push:
    branches:
      - main
    paths:
      - "admin-desktop/**"
      - "civicpulse/admin-desktop/**"
      - ".github/workflows/**"
  workflow_dispatch:

jobs:
  build-windows-exe:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate admin-desktop directory
        id: locate_app
        shell: pwsh
        run: |
          if (Test-Path "admin-desktop/main.py") {
            "app_dir=admin-desktop" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          } elseif (Test-Path "civicpulse/admin-desktop/main.py") {
            "app_dir=civicpulse/admin-desktop" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          } else {
            Write-Error "Could not find main.py in admin-desktop or civicpulse/admin-desktop"
            exit 1
          }

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies and PyInstaller
        shell: pwsh
        working-directory: ${{ steps.locate_app.outputs.app_dir }}
        run: |
          python -m pip install --upgrade pip
          if (Test-Path "requirements.txt") { pip install -r requirements.txt }
          pip install pyinstaller

      - name: Build Windows .exe with PyInstaller
        shell: pwsh
        working-directory: ${{ steps.locate_app.outputs.app_dir }}
        run: |
          $addDataArgs = @()
          if (Test-Path "assets") {
            $addDataArgs += @("--add-data", "assets;assets")
          }
          if (Test-Path "theme.qss") {
            $addDataArgs += @("--add-data", "theme.qss;.")
          } elseif (Test-Path "ui/theme.qss") {
            $addDataArgs += @("--add-data", "ui/theme.qss;ui")
          }

          $iconArgs = @()
          if (Test-Path "assets/civicpulse-icon.ico") {
            $iconArgs = @("--icon", "assets/civicpulse-icon.ico")
          }

          pyinstaller --noconfirm --windowed --onedir `
            --name "CivicPulse Admin" `
            @iconArgs `
            @addDataArgs `
            main.py

      - name: Upload Windows build artifact
        uses: actions/upload-artifact@v4
        with:
          name: civicpulse-admin-windows-exe
          path: ${{ steps.locate_app.outputs.app_dir }}/dist/CivicPulse Admin/
          if-no-files-found: error
