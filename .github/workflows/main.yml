name: Build CivicPulse Admin (Windows .exe)

on:
  push:
    branches:
      - main
    paths:
      - "admin-desktop/**"
      - ".github/workflows/build-windows-admin.yml"
  workflow_dispatch:

jobs:
  build-windows-exe:
    runs-on: windows-latest

    defaults:
      run:
        working-directory: admin-desktop

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: admin-desktop/requirements.txt

      - name: Install dependencies and PyInstaller
        run: |
          python -m pip install --upgrade pip
          if (Test-Path "requirements.txt") { pip install -r requirements.txt }
          pip install pyinstaller

      - name: Build Windows .exe with PyInstaller
        shell: pwsh
        run: |
          $addDataArgs = @("--add-data", "assets;assets")
          if (Test-Path "theme.qss") {
            $addDataArgs += @("--add-data", "theme.qss;.")
          } elseif (Test-Path "ui/theme.qss") {
            $addDataArgs += @("--add-data", "ui/theme.qss;ui")
          }

          $iconArgs = @()
          if (Test-Path "assets/civicpulse-icon.ico") {
            $iconArgs = @("--icon", "assets/civicpulse-icon.ico")
          }

          pyinstaller --noconfirm --windowed --onedir `
            --name "CivicPulse Admin" `
            @iconArgs `
            @addDataArgs `
            main.py

      - name: Upload Windows build artifact
        uses: actions/upload-artifact@v4
        with:
          name: civicpulse-admin-windows-exe
          path: admin-desktop/dist/CivicPulse Admin/
          if-no-files-found: error
