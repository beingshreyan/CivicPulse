<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Citizen Login &amp; Registration — CivicPulse</title>
  <link rel="stylesheet" href="css/variables.css" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/responsive.css" />
  <link rel="icon" type="image/svg+xml" href="/assets/civicpulse-icon.svg" />
  <meta name="theme-color" content="#0b3d3b" />
</head>
<body>
  <header class="navbar">
    <div class="container navbar-inner">
      <a href="index.html" class="brand">
        <span class="brand-dot"></span>
        CIVICPULSE
      </a>
      <div class="nav-actions">
        <a href="index.html" class="btn btn-outline btn-sm">Explore Public Map</a>
      </div>
    </div>
  </header>

  <main class="container">
    <div class="auth-wrapper card">
      <div class="auth-tabs">
        <button type="button" class="auth-tab active" id="tab-login">Login</button>
        <button type="button" class="auth-tab" id="tab-register">Register</button>
      </div>

      <div id="auth-alert" class="alert-box" style="display: none;"></div>

      <!-- Login Form -->
      <form id="login-form">
        <div class="form-group">
          <label for="login-email" class="form-label">Email Address</label>
          <input type="email" id="login-email" class="form-control" placeholder="citizen@example.com" required />
        </div>
        <div class="form-group">
          <label for="login-password" class="form-label">Password</label>
          <input type="password" id="login-password" class="form-control" placeholder="Enter your password" required />
        </div>
        <button type="submit" class="btn btn-primary btn-block">Sign In</button>
      </form>

      <!-- Register Form -->
      <form id="register-form" style="display: none;">
        <div class="form-group">
          <label for="reg-name" class="form-label">Full Name</label>
          <input type="text" id="reg-name" class="form-control" placeholder="Your full name" required />
        </div>
        <div class="form-group">
          <label for="reg-email" class="form-label">Email Address</label>
          <input type="email" id="reg-email" class="form-control" placeholder="citizen@example.com" required />
        </div>
        <div class="form-group">
          <label for="reg-password" class="form-label">Password (min 8 characters)</label>
          <input type="password" id="reg-password" class="form-control" minlength="8" placeholder="Create a strong password" required />
        </div>
        <button type="submit" class="btn btn-primary btn-block">Create Citizen Account</button>
      </form>
    </div>
  </main>

  <footer class="footer">
    <div class="container">
      CivicPulse &mdash; Privacy-Protected Citizen Access
    </div>
  </footer>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
